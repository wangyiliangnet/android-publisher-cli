name: 问题报告
description: 使用合成数据报告可复现的 CLI 或工作流问题。
body:
  - type: markdown
    attributes:
      value: |
        请使用合成示例，不要附带渠道凭据、签名 URL、APK、
        私有应用标识、Cookie 或渠道原始响应。
        安全漏洞请通过本仓库的 Security 页面私下报告。
  - type: input
    id: version
    attributes:
      label: CLI 版本
      description: 请提供工具版本和 macOS 版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供最小合成示例，并说明预期行为与实际行为。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断信息
      description: 仅提供已检查和脱敏的输出，不要包含凭据和账号标识。
