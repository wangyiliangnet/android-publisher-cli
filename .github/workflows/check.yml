name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PUBLISHER_REQUIRE_ANDROID_TESTS: '1'
    steps:
      - name: Check out public source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned audit tools
        run: /bin/sh tools/ci-install-tools.sh

      - name: Check workflow and public-source policy
        run: |
          test "$(uname -m)" = arm64
          actionlint -color
          python3 tools/release-version.py --self-test
          python3 tools/ci-public-scan-test.py
          python3 tools/ci-gitleaks-policy-test.py
          python3 tools/ci-public-scan.py

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false

      - name: Install pinned JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          architecture: aarch64
          java-package: jdk
          check-latest: false

      - name: Install isolated Android SDK
        run: /bin/sh tools/ci-install-android.sh

      - name: Install npm dependencies and run TypeScript checks
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = '11.19.1'
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Pack and install the checked CLI
        run: |
          archive="$RUNNER_TEMP/$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          test -f "$archive"
          npm install --global --prefix "$RUNNER_TEMP/publisher-install" --ignore-scripts --no-audit --no-fund "$archive"
          "$RUNNER_TEMP/publisher-install/bin/android-release" version --json
